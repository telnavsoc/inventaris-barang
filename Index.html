<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventaris Barang Gudang</title>
  <style>
    :root {
      --primary: #1a73e8;
      --primary-hover: #1557b0;
      --bg: #f1f3f4;
      --card-bg: #ffffff;
      --text: #202124;
      --text-muted: #5f6368;
      --border: #dadce0;
      --success: #0d904f;
      --danger: #d93025;
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 16px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 540px;
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
      overflow: hidden;
      margin: auto;
    }

    .header {
      background: linear-gradient(135deg, #1a73e8, #0d47a1);
      color: white;
      padding: 24px 20px;
      text-align: center;
    }

    .header h1 {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .header p {
      font-size: 13px;
      opacity: 0.9;
    }

    form {
      padding: 24px 20px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 6px;
      color: var(--text);
    }

    .required::after {
      content: " *";
      color: var(--danger);
    }

    .optional-tag {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: normal;
    }

    input[type="text"],
    select {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      background: #fff;
    }

    input[type="text"]:focus,
    select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(26, 115, 232, 0.15);
    }

    /* Radio Pills for Kondisi */
    .radio-group {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .radio-option {
      position: relative;
    }

    .radio-option input[type="radio"] {
      position: absolute;
      opacity: 0;
      width: 0;
      height: 0;
    }

    .radio-label {
      display: block;
      text-align: center;
      padding: 10px 8px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      background: #fafafa;
    }

    .radio-option input[type="radio"]:checked + .radio-label {
      background-color: #e8f0fe;
      border-color: var(--primary);
      color: var(--primary);
      font-weight: 600;
    }

    /* Photo Upload Area */
    .upload-box {
      border: 2px dashed var(--border);
      border-radius: 10px;
      padding: 18px;
      text-align: center;
      background: #fafafa;
      cursor: pointer;
      transition: border-color 0.2s, background-color 0.2s;
    }

    .upload-box:hover {
      border-color: var(--primary);
      background-color: #f8fbff;
    }

    .upload-icon {
      font-size: 28px;
      margin-bottom: 6px;
      display: block;
    }

    .upload-text {
      font-size: 14px;
      font-weight: 500;
      color: var(--primary);
    }

    .upload-hint {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    #fileInput {
      display: none;
    }

    /* Previews */
    .preview-container {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 14px;
    }

    .preview-item {
      position: relative;
      border-radius: 8px;
      overflow: hidden;
      aspect-ratio: 1;
      border: 1px solid var(--border);
      background: #000;
    }

    .preview-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .preview-remove {
      position: absolute;
      top: 4px;
      right: 4px;
      background: rgba(0, 0, 0, 0.6);
      color: white;
      border: none;
      border-radius: 50%;
      width: 22px;
      height: 22px;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Submit Button */
    .btn-submit {
      width: 100%;
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 14px;
      font-size: 16px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background-color 0.2s;
    }

    .btn-submit:hover:not(:disabled) {
      background-color: var(--primary-hover);
    }

    .btn-submit:disabled {
      background-color: #bdc1c6;
      cursor: not-allowed;
    }

    /* Spinner */
    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid #ffffff;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: none;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Status Screen */
    .result-card {
      display: none;
      padding: 36px 20px;
      text-align: center;
    }

    .result-icon {
      font-size: 52px;
      margin-bottom: 14px;
    }

    .result-title {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .result-detail {
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 24px;
      line-height: 1.5;
    }

    .btn-secondary {
      background: #e8f0fe;
      color: var(--primary);
      border: none;
      padding: 12px 24px;
      font-size: 15px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>Inventaris Barang Gudang</h1>
      <p>Form Input Database Drive & Spreadsheet</p>
    </div>

    <!-- FORM INPUT -->
    <form id="inventoryForm">
      <!-- Nama Barang -->
      <div class="form-group">
        <label for="namaBarang" class="required">Nama Barang</label>
        <input type="text" id="namaBarang" placeholder="Contoh: Handy Talky Motorola" required>
      </div>

      <!-- Merk / Type -->
      <div class="form-group">
        <label for="merkType">Merk / Type <span class="optional-tag">(Opsional)</span></label>
        <input type="text" id="merkType" placeholder="Contoh: GP328 Plus">
      </div>

      <!-- Lokasi -->
      <div class="form-group">
        <label for="lokasi" class="required">Lokasi</label>
        <select id="lokasi" required>
          <option value="" disabled selected>-- Pilih Lokasi --</option>
          <option value="Ruang telnav">Ruang telnav</option>
          <option value="Gudang recorder">Gudang recorder</option>
          <option value="Gudang safety">Gudang safety</option>
          <option value="Gudang NDB">Gudang NDB</option>
        </select>
      </div>

      <!-- Kondisi -->
      <div class="form-group">
        <label class="required">Kondisi</label>
        <div class="radio-group">
          <div class="radio-option">
            <input type="radio" name="kondisi" id="kondisiBaik" value="Baik" required>
            <label for="kondisiBaik" class="radio-label">Baik</label>
          </div>
          <div class="radio-option">
            <input type="radio" name="kondisi" id="kondisiRusak" value="Rusak">
            <label for="kondisiRusak" class="radio-label">Rusak</label>
          </div>
          <div class="radio-option">
            <input type="radio" name="kondisi" id="kondisiStrip" value="(-)">
            <label for="kondisiStrip" class="radio-label">(-)</label>
          </div>
        </div>
      </div>

      <!-- Foto Upload -->
      <div class="form-group">
        <label>Foto Barang <span class="optional-tag">(Bisa lebih dari 1)</span></label>
        <div class="upload-box" id="uploadBox" onclick="document.getElementById('fileInput').click()">
          <span class="upload-icon">📷</span>
          <div class="upload-text">Ambil Foto / Pilih File</div>
          <div class="upload-hint">Foto dikompres otomatis (max 1600px)</div>
        </div>
        <input type="file" id="fileInput" accept="image/*" multiple capture="environment">

        <div class="preview-container" id="previewContainer"></div>
      </div>

      <!-- Submit Button -->
      <button type="submit" class="btn-submit" id="btnSubmit">
        <div class="spinner" id="btnSpinner"></div>
        <span id="btnText">Simpan Data Barang</span>
      </button>
    </form>

    <!-- HASIL SUKSES -->
    <div class="result-card" id="resultCard">
      <div class="result-icon">✅</div>
      <div class="result-title">Data Berhasil Disimpan!</div>
      <div class="result-detail" id="resultDetail"></div>
      <button type="button" class="btn-secondary" onclick="resetForm()">+ Input Barang Baru</button>
    </div>
  </div>

  <script>
    const selectedPhotos = []; // { file, base64, mimeType }

    const fileInput = document.getElementById('fileInput');
    const previewContainer = document.getElementById('previewContainer');
    const inventoryForm = document.getElementById('inventoryForm');
    const btnSubmit = document.getElementById('btnSubmit');
    const btnSpinner = document.getElementById('btnSpinner');
    const btnText = document.getElementById('btnText');
    const resultCard = document.getElementById('resultCard');
    const resultDetail = document.getElementById('resultDetail');

    // Handle pemilihan file foto
    fileInput.addEventListener('change', async function(e) {
      const files = Array.from(e.target.files);
      if (!files.length) return;

      btnSubmit.disabled = true;
      btnText.textContent = 'Mengompres foto...';
      btnSpinner.style.display = 'block';

      for (const file of files) {
        try {
          const compressed = await compressImage(file, 1600, 0.8);
          selectedPhotos.push(compressed);
          renderPreview(compressed, selectedPhotos.length - 1);
        } catch (err) {
          alert('Gagal memproses gambar: ' + file.name);
        }
      }

      btnSubmit.disabled = false;
      btnText.textContent = 'Simpan Data Barang';
      btnSpinner.style.display = 'none';
      fileInput.value = ''; // Reset input agar bisa pilih file yang sama jika diinginkan
    });

    // Kompres gambar via HTML5 Canvas
    function compressImage(file, maxDimension, quality) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = function(event) {
          const img = new Image();
          img.src = event.target.result;
          img.onload = function() {
            let width = img.width;
            let height = img.height;

            if (width > maxDimension || height > maxDimension) {
              if (width > height) {
                height = Math.round((height * maxDimension) / width);
                width = maxDimension;
              } else {
                width = Math.round((width * maxDimension) / height);
                height = maxDimension;
              }
            }

            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);

            const mimeType = 'image/jpeg';
            const dataUrl = canvas.toDataURL(mimeType, quality);
            const base64 = dataUrl.split(',')[1];

            resolve({
              name: file.name,
              mimeType: mimeType,
              dataUrl: dataUrl,
              base64: base64
            });
          };
          img.onerror = reject;
        };
        reader.onerror = reject;
      });
    }

    // Render thumbnail pratinjau
    function renderPreview(photoObj, index) {
      const div = document.createElement('div');
      div.className = 'preview-item';
      div.id = 'preview-' + index;

      const img = document.createElement('img');
      img.src = photoObj.dataUrl;

      const removeBtn = document.createElement('button');
      removeBtn.type = 'button';
      removeBtn.className = 'preview-remove';
      removeBtn.innerHTML = '&times;';
      removeBtn.onclick = function() {
        div.remove();
        const idx = selectedPhotos.indexOf(photoObj);
        if (idx > -1) selectedPhotos.splice(idx, 1);
      };

      div.appendChild(img);
      div.appendChild(removeBtn);
      previewContainer.appendChild(div);
    }

    // Submit form ke Google Apps Script
    inventoryForm.addEventListener('submit', function(e) {
      e.preventDefault();

      const namaBarang = document.getElementById('namaBarang').value.trim();
      const merkType = document.getElementById('merkType').value.trim();
      const lokasi = document.getElementById('lokasi').value;
      const kondisi = document.querySelector('input[name="kondisi"]:checked')?.value;

      if (!namaBarang || !lokasi || !kondisi) {
        alert('Mohon isi kolom wajib bertanda bintang (*).');
        return;
      }

      btnSubmit.disabled = true;
      btnSpinner.style.display = 'block';
      btnText.textContent = 'Menyimpan ke Drive & Sheet...';

      const payload = {
        namaBarang: namaBarang,
        merkType: merkType,
        lokasi: lokasi,
        kondisi: kondisi,
        photos: selectedPhotos.map(p => ({
          name: p.name,
          mimeType: p.mimeType,
          base64: p.base64
        }))
      };

      const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwPUeDhhzkK9FWGvhln4aW_vl8Vg8TIq9JqWCMfV2cszT94JGjAle9PnQojV6iqM1gN/exec';

      function handleResponse(response) {
        btnSubmit.disabled = false;
        btnSpinner.style.display = 'none';
        btnText.textContent = 'Simpan Data Barang';

        if (response && response.success) {
          showSuccess(response.idBarang, response.photoCount, lokasi, namaBarang);
        } else {
          alert('Gagal menyimpan: ' + (response ? response.error : 'Terjadi kesalahan sistem.'));
        }
      }

      function handleError(error) {
        btnSubmit.disabled = false;
        btnSpinner.style.display = 'none';
        btnText.textContent = 'Simpan Data Barang';
        alert('Error server: ' + (error.message || error));
      }

      if (typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run
          .withSuccessHandler(handleResponse)
          .withFailureHandler(handleError)
          .submitInventoryItem(payload);
      } else {
        fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify(payload)
        })
        .then(res => res.json())
        .then(handleResponse)
        .catch(handleError);
      }
    });

    function showSuccess(idBarang, photoCount, lokasi, namaBarang) {
      inventoryForm.style.display = 'none';
      resultDetail.innerHTML = `
        <strong>${namaBarang}</strong> (${idBarang})<br>
        Lokasi: <strong>${lokasi}</strong><br>
        Jumlah Foto: <strong>${photoCount} foto</strong> terunggah ke Google Drive.
      `;
      resultCard.style.display = 'block';
    }

    function resetForm() {
      inventoryForm.reset();
      selectedPhotos.length = 0;
      previewContainer.innerHTML = '';
      resultCard.style.display = 'none';
      inventoryForm.style.display = 'block';
    }
  </script>
</body>
</html>
